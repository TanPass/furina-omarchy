# Furina — Salon Solitude: Omarchy shell surfaces.
#
# Omarchy v4 reads this file as a complete replacement for the generated
# default/themed/shell.toml, so every section and key of the upstream schema is
# present and no key is invented. The Fontaine treatment is:
#   * one hydro → violet gradient ("35deg") on window borders, focus rings,
#     selected rows, popup/tooltip/notification cards and the lock field;
#   * a slightly translucent bar (`background-alpha`) and card surfaces
#     (`background-alpha` 0.88–0.94) so the wallpaper reads through;
#   * a touch more air than upstream: 28px bar, 30px controls, 20px panels.
# Colors are static on purpose: a shipped shell.toml replaces the template
# output, so no {{ … }} placeholders may appear here.

[bar]
# Slightly translucent bar; bar text is the theme foreground.
background       = "#101322"
background-alpha = 0.84
text             = "#f2edf0"
# Attention modules (recording, alerts, updates) use the Fontaine danger tint.
active           = "#e8807f"
scale-with-font  = true
size-horizontal  = 28
size-vertical    = 30

[hyprland]
# Shared gradient tokens: window borders and every card border reference these,
# so Hyprland, popups, the lock field and the launcher stay in one family.
active-border            = "rgba(dea998ee) rgba(a99bd6ee) 35deg"
active-border-foreground = "rgba(dea998aa) rgba(a99bd6aa) 35deg"

[controls]
# Idle chrome is hairline hydro on near-black; focus is the full gradient.
normal-color        = "#f2edf0"
normal-fill-alpha   = 0.04
normal-border       = "#dea998"
normal-border-width = 1
normal-border-alpha = 0.3

hover-cursor-color        = "#f2edf0"
hover-cursor-fill-alpha   = 0.09
hover-cursor-border       = "#dea998"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.5

focus-color        = "#f2edf0"
focus-fill-alpha   = 0.1
focus-border       = "rgba(dea998ee) rgba(a99bd6ee) 35deg"
focus-border-width = 1
focus-border-alpha = 0.55

selected-color        = "#f2edf0"
selected-fill-alpha   = 0.16
selected-border       = "rgba(dea998ee) rgba(a99bd6ee) 35deg"
selected-border-width = 1
selected-border-alpha = 0.8

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.32

[spacing]
# A little roomier than upstream but still on the document scale.
scale = 1.0
scale-with-font = true
control-gap       = 8
control-padding-x = 12
control-height    = 30
popup-row-height  = 30
row-padding-x     = 14
panel-padding     = 20
popup-padding     = 16

[font]
base-size = 12

[popups]
background       = "#101322"
background-alpha = 0.88
text             = "#f2edf0"
border           = "hyprland.active-border"
border-alpha     = 0.9
border-width     = 1

[tooltip]
background       = "#090b15"
background-alpha = 0.94
text             = "#f2edf0"
border           = "hyprland.active-border-foreground"
border-alpha     = 0.8

[notifications]
background       = "#101322"
background-alpha = 0.92
text             = "#f2edf0"
border           = "hyprland.active-border"
border-alpha     = 0.9
border-width     = 1
countdown        = "#dea998"

[launcher]
background                = "#090b15"
background-alpha          = 0.9
text                      = "#f2edf0"
border                    = "hyprland.active-border-foreground"
border-alpha              = 0.9
scrim                     = "#101322"
scrim-alpha               = 0.55
selected-background       = "#3a3f63"
selected-background-alpha = 0.38
selected-text             = "#dea998"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.45

[menu]
background                = "#101322"
background-alpha          = 0.9
text                      = "#f2edf0"
border                    = "hyprland.active-border-foreground"
border-alpha              = 0.9
scrim                     = "#101322"
scrim-alpha               = 0.55
selected-background       = "#3a3f63"
selected-background-alpha = 0.38
selected-text             = "#dea998"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.45

[polkit]
background       = "#101322"
background-alpha = 0.92
text             = "#f2edf0"
text-error       = "#e8807f"
border           = "hyprland.active-border"
border-error     = "#e8807f"
border-alpha     = 0.9
scrim            = "#101322"
scrim-alpha      = 0.55
accent           = "#dea998"

[lock]
# Lock field: translucent card, gradient border, hydro selection tint.
background       = "#101322"
background-alpha = 0.75
text             = "#faf6f8"
placeholder      = "#a5a3aa"
text-error       = "#e8807f"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#e8807f"
border-alpha     = 1.0
selection        = "#dea998"
selection-alpha  = 0.45

[image-picker]
# The wallpaper carousel shown by `omarchy theme bg`.
text                    = "#f2edf0"
selected-border         = "#dea998"
selected-border-alpha   = 1.0
unselected-border       = "#f2edf0"
unselected-border-alpha = 0.3
